name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          version=$(sh scripts/release.sh version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Exit status 2 means no such tag; any other failure stops the run.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || status=$?
          case $status in
            0) echo "Tag v$version already exists, so there is nothing to release."; echo "release=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "release=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

  archive:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: namedrop-release-apple-silicon
          - runner: ubuntu-24.04
            artifact: namedrop-release-linux-x86_64
          - runner: ubuntu-24.04-arm
            artifact: namedrop-release-linux-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends zsh libc6-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets
      - run: CARGO_TARGET_DIR=target/crate-checks cargo package --locked
      - run: sh scripts/package-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/dist/*
          if-no-files-found: error

  publish:
    needs: [plan, archive]
    # A manual run on another branch builds the archives without publishing them.
    if: needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          sh scripts/release.sh notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Namedrop $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" dist/*.tar.gz dist/*.tar.gz.sha256
