name: Mod tests

on:
  pull_request:
    paths:
      - "mods/**"
      - ".github/workflows/mod.yml"
  push:
    paths:
      - "mods/**"
      - ".github/workflows/mod.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test mods/*/*.test.js
