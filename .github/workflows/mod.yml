name: Mod tests

on:
  pull_request:
    paths:
      - "mods/**"
      - "scripts/package-release.sh"
      - "scripts/package-release.test.js"
      - "keys.json"
      - "RECIPE.md"
      - "Cargo.toml"
      - "herdr-plugin.toml"
      - ".github/workflows/mod.yml"
  push:
    paths:
      - "mods/**"
      - "scripts/package-release.sh"
      - "scripts/package-release.test.js"
      - "keys.json"
      - "RECIPE.md"
      - "Cargo.toml"
      - "herdr-plugin.toml"
      - ".github/workflows/mod.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test mods/*/*.test.js
      - run: node --test scripts/package-release.test.js
