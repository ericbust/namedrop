[package]
name = "namedrop"
version = "1.4.2"
edition = "2024"
rust-version = "1.97"
description = "Name and @mention AI agents and terminal panes to collaborate inside Herdr"
license = "MIT"
repository = "https://github.com/ericbust/namedrop"
readme = "README.md"
keywords = ["agents", "collaboration", "herdr", "mentions"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.scratch/**", "/.unlazy/**", "/docs/assets/**", "/docs/demo/**", "/testbed/**", "**/.DS_Store"]

[lib]
name = "namedrop"
path = "src/lib.rs"

[[bin]]
name = "namedrop"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
toml_edit = "0.25"
libc = "0.2"
unicode-width = { version = "0.2.2", default-features = false }
